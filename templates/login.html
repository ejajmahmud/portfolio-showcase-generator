<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sign In — Portfolio Showcase Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="alternate icon" href="/static/img/favicon.ico">
  <link rel="apple-touch-icon" href="/static/img/favicon.png">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    /* ==========================================================================
       Liquid Glass UI — Standalone Login Page (Apple HIG Master Edition)
       ========================================================================== */
    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      overflow-x: hidden;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-app);
      background-image: var(--bg-mesh);
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      position: relative;
    }

    /* Floating Theme Switcher */
    .theme-switch-floating {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 20;
    }

    .glass-theme-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 30px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(190%);
      -webkit-backdrop-filter: blur(20px) saturate(190%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow-sm);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-theme-btn:hover {
      transform: translateY(-1.5px);
      box-shadow: var(--glass-shadow-hover);
      border-color: var(--brand-primary);
    }

    .glass-theme-btn svg {
      width: 16px;
      height: 16px;
    }

    /* The Main Liquid Glass Card */
    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      padding: 1.5rem;
    }

    .liquid-glass-card {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(36px) saturate(210%) brightness(105%);
      -webkit-backdrop-filter: blur(36px) saturate(210%) brightness(105%);
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      padding: 2.75rem 2.25rem 2.25rem;
      box-shadow: var(--glass-shadow);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Liquid Glass Gem Logo */
    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .liquid-gem-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: var(--gradient-gem);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 
        0 12px 28px -4px rgba(0, 113, 227, 0.45),
        inset 0 2px 2px 0 rgba(255, 255, 255, 0.75),
        inset 0 -2px 2px 0 rgba(0, 0, 0, 0.2);
      color: #ffffff;
      margin-bottom: 1.25rem;
      position: relative;
      overflow: hidden;
    }

    .liquid-gem-logo::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, transparent 100%);
      pointer-events: none;
    }

    .liquid-gem-logo svg {
      width: 32px;
      height: 32px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
    }

    .login-heading {
      font-family: var(--font-display);
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--text-primary);
      margin: 0 0 0.4rem;
      letter-spacing: -0.035em;
      line-height: 1.2;
    }

    .login-subheading {
      font-size: 0.92rem;
      color: var(--text-secondary);
      margin: 0;
      line-height: 1.45;
      font-weight: 500;
    }

    /* Form Fields */
    .liquid-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .liquid-field-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .liquid-label {
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.015em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .liquid-input-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    .liquid-input-icon {
      position: absolute;
      left: 15px;
      width: 18px;
      height: 18px;
      color: var(--text-tertiary);
      pointer-events: none;
      transition: color 0.2s ease;
      z-index: 2;
    }

    .liquid-input {
      width: 100%;
      height: 50px;
      padding: 0 14px 0 46px;
      font-size: 0.95rem;
      font-family: var(--font-body);
      font-weight: 500;
      color: var(--text-primary);
      background: var(--glass-input-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--border-subtle);
      border-radius: 14px;
      outline: none;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .liquid-input::placeholder {
      color: var(--text-muted);
      opacity: 0.75;
    }

    .liquid-input:focus {
      background: var(--glass-input-focus);
      border-color: var(--border-focus);
      box-shadow: var(--shadow-input-focus);
    }

    .liquid-input-container:focus-within .liquid-input-icon {
      color: var(--border-focus);
    }

    .liquid-password-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      padding: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: color 0.2s, background 0.2s;
      z-index: 2;
    }

    .liquid-password-toggle:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.15);
    }

    .liquid-password-toggle svg {
      width: 18px;
      height: 18px;
    }

    /* Primary Liquid Glass Button */
    .liquid-glass-btn {
      width: 100%;
      height: 52px;
      margin-top: 0.6rem;
      border-radius: 16px;
      font-family: var(--font-display);
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #ffffff;
      background: var(--gradient-primary);
      border: 1px solid rgba(255, 255, 255, 0.35);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 
        0 10px 28px -4px rgba(0, 113, 227, 0.45),
        inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.65),
        inset 0 -1.5px 1.5px 0 rgba(0, 0, 0, 0.2);
      transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, background 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .liquid-glass-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0%, transparent 100%);
      border-radius: 16px 16px 0 0;
      pointer-events: none;
    }

    .liquid-glass-btn:hover:not(:disabled) {
      background: var(--gradient-hover);
      transform: translateY(-2px);
      box-shadow: 
        0 16px 36px -4px rgba(0, 113, 227, 0.55),
        inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.85);
    }

    .liquid-glass-btn:active:not(:disabled) {
      transform: scale(0.985);
      box-shadow: 
        0 6px 18px -2px rgba(0, 113, 227, 0.4),
        inset 0 1px 1px 0 rgba(0, 0, 0, 0.2);
    }

    .liquid-glass-btn:disabled {
      opacity: 0.60;
      cursor: not-allowed;
      transform: none;
    }

    .liquid-glass-btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.2s ease;
    }

    .liquid-glass-btn:hover:not(:disabled) svg {
      transform: translateX(3px);
    }

    /* Error Alert */
    .liquid-alert {
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 0.85rem;
      line-height: 1.45;
      margin-bottom: 1rem;
      display: none;
      animation: alertFadeIn 0.2s ease;
    }

    @keyframes alertFadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .liquid-alert.error {
      display: block;
      background: rgba(254, 242, 242, 0.88);
      border: 1px solid rgba(248, 113, 113, 0.55);
      color: #991b1b;
      backdrop-filter: blur(12px);
    }

    [data-theme="dark"] .liquid-alert.error {
      background: rgba(127, 29, 29, 0.45);
      border-color: rgba(239, 68, 68, 0.55);
      color: #fecaca;
    }

    /* User Guide Link Pill */
    .liquid-guide-link {
      margin-top: 1.25rem;
      padding: 12px 16px;
      border-radius: 16px;
      background: var(--glass-surface-subtle);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border-subtle);
      box-shadow: var(--glass-shadow-sm);
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-secondary);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .liquid-guide-link:hover {
      background: var(--glass-surface-elevated);
      border-color: var(--brand-primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 113, 227, 0.16);
    }

    .guide-link-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(0, 113, 227, 0.12);
      border: 1px solid rgba(0, 113, 227, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--brand-primary);
    }

    .guide-link-icon svg {
      width: 18px;
      height: 18px;
    }

    .guide-link-text {
      flex: 1;
      text-align: left;
    }

    .guide-link-title {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .guide-arrow {
      width: 14px;
      height: 14px;
      color: var(--brand-primary);
      transition: transform 0.2s ease;
    }

    .liquid-guide-link:hover .guide-arrow {
      transform: translateX(3px);
    }

    .guide-link-desc {
      font-size: 0.74rem;
      color: var(--text-secondary);
      margin-top: 2px;
      line-height: 1.35;
    }

    /* Bottom Info Card (Apple Sub-Material Capsule) */
    .liquid-info-pill {
      margin-top: 1.75rem;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--glass-surface-subtle);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border-subtle);
      box-shadow: var(--glass-shadow-sm);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--text-secondary);
    }

    .liquid-info-pill svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: var(--brand-primary);
      margin-top: 1px;
    }

    .liquid-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 0.55rem 0;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .liquid-divider::before,
    .liquid-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-subtle);
    }

    .liquid-divider span {
      padding: 0 10px;
    }

    .liquid-glass-btn-secondary {
      background: var(--glass-surface);
      color: var(--text-primary);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow-sm);
      margin-top: 0;
    }

    .liquid-glass-btn-secondary:hover {
      background: var(--glass-surface-hover);
      border-color: var(--brand-primary);
      box-shadow: 0 4px 16px rgba(0, 113, 227, 0.16);
      transform: translateY(-1.5px);
    }

    .liquid-glass-btn-secondary svg {
      width: 17px;
      height: 17px;
      color: var(--brand-primary);
    }

    .login-footer {
      margin-top: 1.25rem;
      padding: 0 1rem;
      width: 100%;
      text-align: center;
    }

    .login-footer p {
      font-size: 11px;
      padding: 0;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: rgba(30, 41, 59, 0.65);
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.4;
      text-align: center;
    }

    [data-theme="dark"] .login-footer p {
      color: rgba(255, 255, 255, 0.42);
    }

    /* --------------------------------------------------------------------------
       Mobile & Short Viewports (Zero Unnecessary Vertical Scroll)
       -------------------------------------------------------------------------- */
    @media (max-width: 480px), (max-height: 740px) {
      body {
        padding: 10px 0;
        box-sizing: border-box;
      }
      .theme-switch-floating {
        top: 10px;
        right: 12px;
      }
      .glass-theme-btn {
        padding: 5px 12px;
        font-size: 11.5px;
        border-radius: 20px;
      }
      .login-wrapper {
        padding: 8px 14px;
        max-width: 420px;
        box-sizing: border-box;
      }
      .liquid-glass-card {
        padding: 1.25rem 1.15rem 1.15rem;
        border-radius: 22px;
      }
      .login-brand {
        margin-bottom: 0.85rem;
      }
      .liquid-gem-logo {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        margin-bottom: 0.5rem;
      }
      .liquid-gem-logo svg {
        width: 22px;
        height: 22px;
      }
      .login-heading {
        font-size: 1.25rem;
        margin-bottom: 0.2rem;
      }
      .login-subheading {
        font-size: 0.78rem;
        line-height: 1.35;
      }
      .liquid-form {
        gap: 0.75rem;
      }
      .liquid-field-group {
        gap: 0.35rem;
      }
      .liquid-label {
        font-size: 0.78rem;
      }
      .liquid-input {
        height: 44px;
        font-size: 16px !important;
        border-radius: 12px;
        padding-left: 42px;
      }
      .liquid-input-icon {
        left: 13px;
        width: 16px;
        height: 16px;
      }
      .liquid-glass-btn {
        height: 46px;
        margin-top: 0.2rem;
        font-size: 0.92rem;
        border-radius: 13px;
      }
      .liquid-info-pill {
        margin-top: 0.75rem;
        padding: 9px 12px;
        font-size: 0.73rem;
        line-height: 1.35;
        gap: 8px;
        border-radius: 12px;
      }
      .liquid-info-pill svg {
        width: 15px;
        height: 15px;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient Liquid Canvas & Dark Grain Gradient Backdrop -->
  <div class="liquid-grain-overlay" aria-hidden="true"></div>
  <div class="liquid-canvas" aria-hidden="true">
    <div class="liquid-orb orb-1"></div>
    <div class="liquid-orb orb-2"></div>
    <div class="liquid-orb orb-3"></div>
    <div class="liquid-orb orb-4"></div>
  </div>

  <!-- Floating Liquid Glass Theme Switcher -->
  <div class="theme-switch-floating">
    <button id="theme-toggle" class="glass-theme-btn" aria-label="Toggle visual theme" title="Toggle Light / Dark mode">
      <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <span class="theme-label">Theme</span>
    </button>
  </div>

  <div class="login-wrapper">
    <div class="liquid-glass-card">
      <div class="login-brand">
        <div class="liquid-gem-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <h1 class="login-heading">Portfolio Showcase Studio</h1>
        <p class="login-subheading">Sign in to access the multi-device showcase studio</p>
      </div>

      <div id="login-alert" class="liquid-alert"></div>

      <form id="login-form" class="liquid-form">
        <div class="liquid-field-group">
          <label class="liquid-label" for="username">Username</label>
          <div class="liquid-input-container">
            <svg class="liquid-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="username" class="liquid-input" name="username" placeholder="Enter your username" required autocomplete="username" />
          </div>
        </div>

        <div class="liquid-field-group">
          <label class="liquid-label" for="password">Password</label>
          <div class="liquid-input-container">
            <svg class="liquid-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="password" class="liquid-input" name="password" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" id="toggle-password-btn" class="liquid-password-toggle" aria-label="Show password">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="liquid-glass-btn">
          <span>Sign In to Studio</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

        <div class="liquid-divider">
          <span>or explore without password</span>
        </div>

        <button type="button" id="guest-btn" class="liquid-glass-btn liquid-glass-btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Login as Guest</span>
        </button>
      </form>

      <a href="/guide" class="liquid-guide-link" target="_blank" rel="noopener" id="user-guide-link">
        <div class="guide-link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
        </div>
        <div class="guide-link-text">
          <div class="guide-link-title">
            <span>Official User Guide & Documentation</span>
            <svg class="guide-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </div>
          <div class="guide-link-desc">Complete interactive manual for Guest onboarding, batch queues & asset exports</div>
        </div>
      </a>
    </div>

    <!-- Footer Copyright in Login Page -->
    <footer class="app-footer login-footer">
      <p>Portfolio Image Generator - Powered by Shinjiru Technology Sdn. Bhd.</p>
    </footer>
  </div>

  <script>
    // Theme toggle
    const themeToggle = document.getElementById('theme-toggle');
    function getPreferredTheme() {
      const saved = localStorage.getItem('portfolio-showcase-theme');
      if (saved === 'light' || saved === 'dark') return saved;
      return 'light';
    }
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('portfolio-showcase-theme', theme);
    }
    applyTheme(getPreferredTheme());
    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        applyTheme(current === 'light' ? 'dark' : 'light');
      });
    }

    // Password toggle
    const pwdInput = document.getElementById('password');
    const togglePwdBtn = document.getElementById('toggle-password-btn');
    if (togglePwdBtn && pwdInput) {
      togglePwdBtn.addEventListener('click', () => {
        const isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        togglePwdBtn.setAttribute('aria-label', isPwd ? 'Hide password' : 'Show password');
        togglePwdBtn.innerHTML = isPwd
          ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
          : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      });
    }

    // Login Form Submit
    const loginForm = document.getElementById('login-form');
    const alertBox = document.getElementById('login-alert');
    const submitBtn = document.getElementById('submit-btn');

    if (loginForm) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.className = 'liquid-alert';
        alertBox.textContent = '';
        submitBtn.disabled = true;
        submitBtn.querySelector('span').textContent = 'Signing in...';

        const username = document.getElementById('username').value.trim();
        const password = pwdInput.value;

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.detail || 'Invalid username or password.');
          }

          localStorage.setItem('portfolio_user', JSON.stringify(data.user));
          window.location.href = '/';
        } catch (err) {
          alertBox.className = 'liquid-alert error';
          alertBox.textContent = err.message;
          submitBtn.disabled = false;
          submitBtn.querySelector('span').textContent = 'Sign In to Studio';
        }
      });
    }

    // Guest Direct Authentication
    const guestBtn = document.getElementById('guest-btn');
    if (guestBtn) {
      guestBtn.addEventListener('click', async () => {
        guestBtn.disabled = true;
        const origText = guestBtn.querySelector('span').textContent;
        guestBtn.querySelector('span').textContent = 'Entering Studio as Guest...';

        try {
          const res = await fetch('/api/auth/guest-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.detail || 'Could not initiate guest session.');
          }

          localStorage.setItem('portfolio_user', JSON.stringify(data.user));
          window.location.href = data.redirect || '/';
        } catch (err) {
          alertBox.className = 'liquid-alert error';
          alertBox.textContent = err.message;
          guestBtn.disabled = false;
          guestBtn.querySelector('span').textContent = origText;
        }
      });
    }
  </script>
</body>
</html>
