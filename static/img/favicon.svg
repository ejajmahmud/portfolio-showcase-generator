<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="appleGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0062cc" />
      <stop offset="50%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#38a5ff" />
    </linearGradient>
    <linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#appleGem)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.5" />
  <!-- Specular highlight -->
  <rect x="3" y="3" width="58" height="26" rx="14" fill="url(#specular)" />
  <!-- Monitor Vector -->
  <g transform="translate(14, 14) scale(1.5)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="20" height="14" rx="2"></rect>
    <line x1="8" y1="21" x2="16" y2="21"></line>
    <line x1="12" y1="17" x2="12" y2="21"></line>
  </g>
</svg>